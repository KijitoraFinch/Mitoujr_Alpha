name: release

on:
  push:
    branches:
      - pre-alpha
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag in the form v<semver>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tagged.outputs.commit || steps.pre_alpha.outputs.commit }}
      identity: ${{ steps.tagged.outputs.identity || steps.pre_alpha.outputs.identity }}
      tag: ${{ steps.tagged.outputs.tag || steps.pre_alpha.outputs.tag }}
      version: ${{ steps.tagged.outputs.version || steps.pre_alpha.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - id: tagged
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python tools/release_assets.py metadata
          --tag "${{ inputs.tag }}"
          --github-output "$GITHUB_OUTPUT"
      - id: pre_alpha
        if: github.event_name == 'push'
        run: >-
          python tools/release_assets.py pre-alpha-metadata
          --commit "${{ github.sha }}"
          --github-output "$GITHUB_OUTPUT"

  cli:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-aarch64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MONIKA_BUILD_IDENTITY: ${{ needs.metadata.outputs.identity }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: python -m pip install --requirement tools/requirements-ci.txt
      - run: opam install . --deps-only --with-test
        working-directory: sugar
      - run: opam exec -- python tools/check_phase0.py
      - run: opam exec -- python tools/test_json_contract.py
      - run: opam exec -- python tools/test_semantic_contract.py
      - run: opam exec -- python tools/test_report_bundle.py
      - run: opam exec -- python tools/test_release_assets.py
      - run: opam exec -- python tools/check_golden.py
      - run: opam exec -- dune runtest --root sugar
      - run: opam exec -- python tools/check_distribution.py
      - run: git diff --exit-code -- sugar/monika_sugar.opam
      - run: opam exec -- dune build --root sugar --profile release bin/main.exe
      - run: >-
          opam exec -- python tools/release_assets.py package-cli
          --executable sugar/_build/default/bin/main.exe
          --output-dir dist
          --version "${{ needs.metadata.outputs.version }}"
          --commit "${{ needs.metadata.outputs.commit }}"
          --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  assemble:
    needs:
      - metadata
      - cli
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - run: >-
          python tools/release_assets.py package-skills
          --output-dir dist
          --version "${{ needs.metadata.outputs.version }}"
          --commit "${{ needs.metadata.outputs.commit }}"
      - run: >-
          python tools/release_assets.py finalize
          --assets-dir dist
          --version "${{ needs.metadata.outputs.version }}"
          --tag "${{ needs.metadata.outputs.tag }}"
          --commit "${{ needs.metadata.outputs.commit }}"
      - run: >-
          python tools/release_assets.py verify
          --assets-dir dist
          --version "${{ needs.metadata.outputs.version }}"
          --tag "${{ needs.metadata.outputs.tag }}"
          --commit "${{ needs.metadata.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: monika-${{ needs.metadata.outputs.version }}-release
          path: dist/
          if-no-files-found: error
      - env:
          GH_TOKEN: ${{ github.token }}
        if: github.event_name == 'workflow_dispatch'
        run: >-
          gh release create "${{ needs.metadata.outputs.tag }}" dist/*
          --verify-tag
          --draft
          --prerelease
          --title "Monika ${{ needs.metadata.outputs.version }}"
          --repo "${{ github.repository }}"
          --generate-notes
      - env:
          GH_TOKEN: ${{ github.token }}
        if: github.event_name == 'push'
        run: >-
          gh release create "${{ needs.metadata.outputs.tag }}" dist/*
          --target "${{ needs.metadata.outputs.commit }}"
          --prerelease
          --latest=false
          --title "Monika pre-alpha ${{ needs.metadata.outputs.version }}"
          --repo "${{ github.repository }}"
          --notes "Automated pre-alpha snapshot for commit ${{ needs.metadata.outputs.commit }}."
