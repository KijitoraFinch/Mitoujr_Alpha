name: phase0

on:
  push:
  pull_request:

jobs:
  phase0:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install --requirement tools/requirements-ci.txt
      - run: opam install . --deps-only --with-test
        working-directory: sugar
      - run: opam exec -- python tools/check_phase0.py
      - run: opam exec -- python tools/test_json_contract.py
      - run: opam exec -- python tools/test_semantic_contract.py
      - run: opam exec -- python tools/test_report_bundle.py
      - run: opam exec -- python tools/test_release_assets.py
      - run: opam exec -- python tools/check_golden.py
      - run: opam exec -- dune build --root sugar @install
      - run: opam exec -- dune runtest --root sugar
      - run: opam exec -- python tools/check_distribution.py
      - run: cargo fmt --manifest-path bitter/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path bitter/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path bitter/Cargo.toml
      - run: python tools/check_bitter.py
      - run: git diff --exit-code -- sugar/monika_sugar.opam
